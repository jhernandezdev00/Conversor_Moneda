<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversor Exchange</title>
    <meta name="description" content="Convierte entre más de 150 divisas con tasas actualizadas a diario.">
    <link rel="icon" href="images/exchange.png">

    <script>
        document.documentElement.dataset.bsTheme =
            matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" type="module"></script>
</head>
<body class="bg-body-tertiary">
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <header class="hero col-lg-4 d-flex flex-column justify-content-end p-4 p-lg-5 text-white">
            <h1 class="display-5 fw-bold mb-2">Conversor Exchange</h1>
            <p class="small opacity-75 mb-0">@Jorge Antonio</p>
        </header>

        <main class="col-lg-8 d-flex align-items-center justify-content-center p-3 p-md-5">
            <div class="converter w-100">

                <form id="converter-form" class="mb-4" novalidate>
                    <div class="mb-3">
                        <label for="amount" class="form-label fw-semibold text-body-secondary">Importe</label>
                        <input id="amount" name="amount"
                               class="form-control form-control-lg numeric amount-input"
                               type="text" inputmode="decimal" autocomplete="off"
                               placeholder="0.00" value="1" aria-describedby="amount-error">
                        <div id="amount-error" class="invalid-feedback"></div>
                    </div>

                    <div class="row g-2 align-items-end">
                        <div class="col">
                            <label for="from" class="form-label fw-semibold text-body-secondary">De</label>
                            <select id="from" name="from" class="form-select form-select-lg" disabled>
                                <option>Cargando divisas…</option>
                            </select>
                        </div>

                        <div class="col-auto">
                            <button id="swap" type="button" class="btn btn-outline-brand btn-lg swap-button"
                                    aria-label="Intercambiar divisas" title="Intercambiar divisas" disabled>
                                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                                    <path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"
                                          fill="none" stroke="currentColor" stroke-width="2"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>

                        <div class="col">
                            <label for="to" class="form-label fw-semibold text-body-secondary">A</label>
                            <select id="to" name="to" class="form-select form-select-lg" disabled>
                                <option>Cargando divisas…</option>
                            </select>
                        </div>
                    </div>
                </form>

                <section class="card border-0 shadow-sm" aria-live="polite" aria-atomic="true">
                    <div class="card-body p-4">
                        <p id="result-source" class="numeric text-body-secondary mb-1">
                            Escribe un importe para convertir
                        </p>
                        <p id="result-value" class="numeric result-value fw-bold mb-3">—</p>
                        <p id="rate" class="numeric small text-body-secondary mb-0"></p>
                        <p id="inverse-rate" class="numeric small text-body-secondary mb-3"></p>
                        <button id="copy" type="button" class="btn btn-outline-brand btn-sm" disabled>
                            Copiar resultado
                        </button>
                    </div>
                </section>

                <div class="d-flex align-items-center gap-3 mt-3" role="status">
                    <p id="status-text" class="small text-body-secondary mb-0 flex-grow-1">
                        Cargando tasas de cambio…
                    </p>
                    <button id="retry" type="button" class="btn btn-outline-brand btn-sm" hidden>
                        Reintentar
                    </button>
                </div>

            </div>
        </main>

    </div>
</div>
</body>
</html>
